[project]
name = "chatterbox-tts"
version = "0.1.6"
description = "Chatterbox: Open Source TTS and Voice Conversion by Resemble AI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "resemble-ai", email = "engineering@resemble.ai"}
]
dependencies = [
    #"numpy>=1.24.0,<1.26.0",
    "numpy",
    #"librosa==0.11.0",
    "librosa",
    #"s3tokenizer",
    "s3tokenizer",
    #"torch==2.6.0",
    "torch",
    #"torchaudio==2.6.0",
    "torchaudio",
    #"transformers==4.46.3",
    "transformers",
    #"diffusers==0.29.0",
    "diffusers",
    #"resemble-perth==1.0.1",
    "resemble-perth",
    #"conformer==0.3.2",
    "conformer",
    #"safetensors==0.5.3",
    "safetensors",
    "spacy-pkuseg",
    #"pykakasi==2.3.0",
    "pykakasi",
    #"gradio==5.44.1",
    "gradio",
    "pyloudnorm",
    "omegaconf"
]

[project.urls]
Homepage = "https://github.com/resemble-ai/chatterbox"
Repository = "https://github.com/resemble-ai/chatterbox"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
